[package]
name = "shrimp-checker-psp"
version = "0.1.3"
edition = "2024"
description = "Are you a shrimp? Find out on your PSP."
license = "WTFPL"
repository = "https://github.com/wielorzeczownik/shrimp-checker-psp"
readme = "README.md"
keywords = ["psp", "homebrew", "shrimp", "game"]
categories = ["games"]

[dependencies]
psp = "0.3.13"
embedded-graphics = { version = "0.8.2", default-features = false }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
minimp3 = "0.6.1"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_ptr_alignment = "allow"
